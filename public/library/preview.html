<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanvaCraft 요소 라이브러리 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f8;color:#253145;font-family:system-ui,sans-serif}header{padding:30px 36px;background:white;border-bottom:1px solid #e4e5ed}h1{font-size:25px;margin:0 0 10px}p{font-size:14px;color:#677285;line-height:1.7;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}input,button,select{font:inherit;min-height:44px;border:1px solid #d6d9e2;border-radius:10px;background:#fff;padding:10px 14px}button{cursor:pointer}button[aria-pressed=true]{background:#ede6ff;color:#6433b8;border-color:#b28aee}input{width:260px}.palette{display:flex;gap:7px;margin-left:auto}.swatch{width:34px;height:34px;min-height:34px;border-radius:50%;padding:0}.swatch[aria-pressed=true]{outline:3px solid #9161da;outline-offset:2px}.content{padding:24px 36px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}.card{display:flex;flex-direction:column;align-items:center;background:white;border:1px solid #e4e5ed;border-radius:16px;padding:14px;min-width:0}.image{width:100%;height:126px;display:flex;align-items:center;justify-content:center;background-color:#fff;background-image:linear-gradient(45deg,#f1f1f5 25%,transparent 25%),linear-gradient(-45deg,#f1f1f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1f1f5 75%),linear-gradient(-45deg,transparent 75%,#f1f1f5 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;border-radius:8px}.image img{width:108px;height:108px;object-fit:contain}.label{font-size:13px;font-weight:600;margin:13px 0 5px;text-align:center}.category{font-size:11px;color:#778196}.links{display:flex;gap:14px;margin-top:9px}.links a{font-size:11px;color:#7250b0}#count{margin:0 0 20px;font-size:13px;color:#69758b}footer{padding:20px 36px;font-size:12px;background:white}footer a{color:#7250b0}@media(max-width:650px){header,.content{padding:20px}.palette{margin-left:0}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{padding:8px}.image{height:90px}.image img{width:80px;height:80px}input{width:100%}}
</style>
<header><h1>만들기에 필요한 친구들, 120가지</h1><p>도형 24종 · 캐릭터 60종 · 스티커 36종. 요소 패널 연결 전 자산을 살펴보는 별도 미리보기입니다.</p>
<div class="toolbar"><input id="query" aria-label="요소 검색" placeholder="고양이, 친구, 하트, 화살표…"><button data-kind="all" aria-pressed="true">전체</button><button data-kind="shape" aria-pressed="false">도형</button><button data-kind="character" aria-pressed="false">캐릭터</button><button data-kind="sticker" aria-pressed="false">스티커</button><select id="category" aria-label="세부 카테고리"><option value="">모든 카테고리</option></select><div id="palette" class="palette" aria-label="도형 색"></div></div></header>
<main class="content"><p id="count" role="status">목록을 불러오는 중입니다.</p><div id="grid" class="grid"></div></main>
<footer>캐릭터·스티커: Microsoft Fluent Emoji, MIT License · <a href="licenses/fluent-emoji-MIT.txt">라이선스</a> · 도형: CanvaCraft 원본, <a href="licenses/original-shapes-CC0.txt">CC0</a></footer>
<script type="module">
const manifest=await fetch('manifest.json').then(response=>{if(!response.ok)throw Error('목록 로드 실패');return response.json()});
let kind='all',color='mint';const query=document.querySelector('#query'),category=document.querySelector('#category'),grid=document.querySelector('#grid');
const names={mint:'민트',purple:'보라',blue:'파랑',yellow:'노랑',pink:'분홍',orange:'주황',white:'흰색',dark:'진회색'};
for(const [id,hex] of Object.entries(manifest.palette)){const button=document.createElement('button');button.className='swatch';button.style.background=hex;button.title=names[id];button.setAttribute('aria-label',names[id]);button.setAttribute('aria-pressed',String(id===color));button.onclick=()=>{color=id;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()};document.querySelector('#palette').append(button)}
function categories(){category.replaceChildren(new Option('모든 카테고리',''));for(const name of new Set(manifest.assets.filter(a=>kind==='all'||a.kind===kind).map(a=>a.category)))category.append(new Option(name,name))}
function render(){const q=query.value.trim().normalize('NFKC').toLocaleLowerCase('ko');const matches=manifest.assets.filter(a=>(kind==='all'||a.kind===kind)&&(!category.value||a.category===category.value)&&[a.label,...a.tags].join(' ').normalize('NFKC').toLocaleLowerCase('ko').includes(q));grid.replaceChildren();for(const asset of matches){const card=document.createElement('article');card.className='card';card.dataset.id=asset.id;const image=document.createElement('img');image.src=asset.colorVariants?.find(v=>v.id===color)?.image??asset.thumbnail;image.alt=asset.label;image.loading='lazy';const preview=document.createElement('div');preview.className='image';preview.append(image);const label=document.createElement('div');label.className='label';label.textContent=asset.label;const cat=document.createElement('div');cat.className='category';cat.textContent=asset.category;const links=document.createElement('div');links.className='links';for(const [text,url] of [['PNG',asset.colorVariants?.find(v=>v.id===color)?.image??asset.image],['SVG',asset.svg]]){const a=document.createElement('a');a.href=url;a.textContent=text;a.download='';links.append(a)}card.append(preview,label,cat,links);grid.append(card)}document.querySelector('#count').textContent=`${matches.length}개 · 도형은 오른쪽 팔레트에서 색을 골라 보세요.`}
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{kind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));categories();render()});query.oninput=render;category.onchange=render;categories();render();
</script>
</html>
