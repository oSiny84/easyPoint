<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CanvaCraft 배경 24종</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f8;color:#29364b}header{background:white;padding:28px 32px;border-bottom:1px solid #e0e4ed}h1{font-size:25px;margin:0 0 10px}p{font-size:13px;line-height:1.7;color:#68788d;margin:6px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,input{font:inherit;border:1px solid #d7deea;border-radius:9px;padding:10px 12px;background:white;min-height:44px}button{cursor:pointer}button[aria-pressed=true]{background:#ece6fb;border-color:#a483db;color:#6943a7}input{width:245px}label{display:flex;align-items:center;font-size:13px;gap:5px;margin-left:auto}label input{width:auto;min-height:auto}.grid{padding:24px 32px 36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #dfe4ee;border-radius:12px;overflow:hidden}.picture{position:relative;aspect-ratio:16/9}.picture img{width:100%;height:100%;display:block}.safe{position:absolute;left:17.1875%;top:16.6667%;width:65.625%;height:66.6667%;border:1px dashed currentColor;display:none;opacity:.65}.sample{position:absolute;left:20%;top:29%;width:60%;display:none}.sample strong{font-size:clamp(14px,1.8vw,25px);letter-spacing:-.5px}.sample p{font-size:clamp(8px,1vw,13px);color:inherit;margin-top:6px}.info{padding:13px 15px}.info strong{font-size:13px}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:9px;font-size:11px;color:#7b879b}a{color:#7550b3}.text-on .sample{display:block}.safe-on .safe{display:block}footer{padding:20px 32px;background:white;font-size:12px;color:#748098}.empty{padding:32px}#count{margin-top:14px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){header{padding:20px}.grid{padding:16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{margin-left:0}.sample strong{font-size:14px}.sample p{font-size:8px}}</style>
<header><h1>이야기를 담을 배경, 24가지</h1><p>글씨와 사진이 돋보이는 16:9 배경. 원본은 2560 × 1440 PNG이며, 가운데에는 장식을 줄였습니다.</p><div class="tools"><input aria-label="배경 검색" id="query" placeholder="바다, 학교, 생일, 우주…"><button data-category="전체" aria-pressed="true">전체</button><button data-category="기본" aria-pressed="false">기본</button><button data-category="학교" aria-pressed="false">학교</button><button data-category="자연" aria-pressed="false">자연</button><button data-category="축하" aria-pressed="false">축하</button><button data-category="계절" aria-pressed="false">계절</button><button data-category="동화" aria-pressed="false">동화</button><label><input type="checkbox" id="sample">글씨 예시</label><label><input type="checkbox" id="safe">배치 영역</label></div><p id="count" role="status">불러오는 중…</p></header>
<main class="grid" id="grid"></main><footer>CanvaCraft 배경 구성: CC0 · 일부 그림: Microsoft Fluent Emoji, MIT · <a href="licenses/fluent-emoji-MIT.txt">라이선스</a> · 앱 연결 전 자산 검수용 페이지입니다.</footer>
<script type="module">
const data=await fetch('manifest.json').then(r=>{if(!r.ok)throw Error('배경 목록 오류');return r.json()});let selected='전체';const query=document.querySelector('#query'),grid=document.querySelector('#grid');
function render(){const q=query.value.normalize('NFKC').trim();const matches=data.assets.filter(a=>(selected==='전체'||a.category===selected)&&[a.label,...a.tags].join(' ').normalize('NFKC').includes(q));grid.replaceChildren();for(const asset of matches){const card=document.createElement('article');card.className='card';card.dataset.id=asset.id;const picture=document.createElement('div');picture.className='picture';picture.style.color=asset.recommendedTextColor;const image=document.createElement('img');image.src=asset.thumbnail;image.alt=asset.label;image.loading='lazy';const safe=document.createElement('div');safe.className='safe';const text=document.createElement('div');text.className='sample';const title=document.createElement('strong');title.textContent='나의 멋진 이야기';const body=document.createElement('p');body.textContent='우리의 생각을 함께 나눠요.';text.append(title,body);picture.append(image,safe,text);const info=document.createElement('div');info.className='info';const label=document.createElement('strong');label.textContent=asset.label;const meta=document.createElement('div');meta.className='meta';const category=document.createElement('span');category.textContent=asset.category;const link=document.createElement('a');link.href=asset.image;link.download='';link.textContent='원본 PNG';meta.append(category,link);info.append(label,meta);card.append(picture,info);grid.append(card)}document.querySelector('#count').textContent=`${matches.length}개 · 글씨 예시와 배치 영역은 검수용이며 배경 이미지에는 들어 있지 않습니다.`}
query.oninput=render;document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{selected=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()});document.querySelector('#sample').onchange=e=>document.body.classList.toggle('text-on',e.target.checked);document.querySelector('#safe').onchange=e=>document.body.classList.toggle('safe-on',e.target.checked);render();
</script></html>
