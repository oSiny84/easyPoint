<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CanvaCraft 시작 템플릿 12종</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#2c3b50;font-family:system-ui,sans-serif}header{padding:28px 32px;background:white;border-bottom:1px solid #dfe5ef}h1{font-size:25px;margin:0 0 10px}p{font-size:13px;color:#6d7a8f;line-height:1.8;margin:6px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,input{min-height:44px;padding:10px 13px;font:inherit;border:1px solid #d5ddeb;border-radius:10px;background:#fff}button{cursor:pointer}button[aria-pressed=true]{background:#ede6fb;color:#7143ad;border-color:#ae8bdc}input{width:240px}.grid{padding:24px 32px 36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid #dee4ed;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;display:block}.info{padding:15px 17px}.info h2{font-size:16px;margin:0 0 7px}.meta{font-size:12px;color:#718098;line-height:1.6}.links{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.links a{font-size:12px;color:#7450ad}.download{display:inline-block;border:1px solid #d3c4e8;background:#f7f1ff;border-radius:8px;padding:10px}.guide{margin:20px 32px 0;padding:13px 17px;border:1px solid #e1d7ee;border-radius:10px;background:#fcfaff}footer{padding:20px 32px;background:white;font-size:12px;color:#748096}footer a{color:#7450ad}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){header{padding:20px}.grid{padding:16px;grid-template-columns:1fr}.guide{margin:16px}}</style>
<header><h1>글씨만 바꿔도 시작할 수 있어요</h1><p>자기소개부터 감사 편지까지, 한 장짜리 템플릿 12종. 글씨·캐릭터·안내 상자는 개별 요소로 편집할 수 있어요.</p><div class="tools"><input id="query" aria-label="템플릿 검색" placeholder="가족, 독서, 동물, 꿈…"><button data-category="전체" aria-pressed="true">전체</button><button data-category="자기소개" aria-pressed="false">자기소개</button><button data-category="가족·친구" aria-pressed="false">가족·친구</button><button data-category="학교·탐구" aria-pressed="false">학교·탐구</button><button data-category="여행·생활" aria-pressed="false">여행·생활</button><button data-category="자연·꿈" aria-pressed="false">자연·꿈</button><button data-category="마음·편지" aria-pressed="false">마음·편지</button></div><p id="count" role="status">목록을 불러오는 중…</p></header>
<div class="guide"><p>검수용 페이지입니다. 원본을 내려받아 앱의 ‘원본 열기’로 열면 새 작품으로 시작할 수 있어요. 사진 자리는 자동 교체 프레임이 아니라 안내 상자예요. 사진을 넣은 뒤 안내 상자·글씨를 지워 주세요.</p></div><main id="grid" class="grid"></main><footer>템플릿 구성: CanvaCraft CC0 · 일부 그림: Microsoft Fluent Emoji MIT · <a href="licenses/fluent-emoji-MIT.txt">라이선스</a></footer>
<script type="module">
const data=await fetch('manifest.json').then(r=>{if(!r.ok)throw Error('템플릿 목록 오류');return r.json()});let selected='전체';const query=document.querySelector('#query'),grid=document.querySelector('#grid');
function render(){const q=query.value.trim().normalize('NFKC');const matches=data.templates.filter(a=>(selected==='전체'||a.category===selected)&&[a.label,...a.tags].join(' ').normalize('NFKC').includes(q));grid.replaceChildren();for(const entry of matches){const card=document.createElement('article');card.className='card';card.dataset.id=entry.id;const image=document.createElement('img');image.src=entry.preview;image.alt=entry.label;image.loading='lazy';const info=document.createElement('div');info.className='info';const heading=document.createElement('h2');heading.textContent=entry.label;const meta=document.createElement('div');meta.className='meta';meta.textContent=`${entry.category} · 1장 · 글씨 ${entry.editableTextCount}개 · 사진 자리 ${entry.photoSlots.length}개`;const links=document.createElement('div');links.className='links';const png=document.createElement('a');png.href=entry.preview;png.textContent='크게 보기';png.target='_blank';png.rel='noopener';const download=document.createElement('a');download.href=entry.file;download.download='';download.textContent='편집할 원본 받기';download.className='download';links.append(png,download);info.append(heading,meta,links);card.append(image,info);grid.append(card)}document.querySelector('#count').textContent=`${matches.length}종 · 배경·사진·그림 자산을 포함한 원본 파일을 제공합니다.`}
query.oninput=render;document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{selected=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()});render();
</script></html>
