<!doctype html><html><meta charset="utf-8"><body><script type="module">
import '@fontsource/noto-sans-kr/400.css';
import '@fontsource/noto-sans-kr/700.css';
import {exportPptx} from './snapshot/src/export/exportPptx.ts';
import {exportPdf} from './snapshot/src/export/exportPdf.ts';
import {renderSlide} from './snapshot/src/rendering/renderSlide.ts';
import {layoutText} from './snapshot/src/rendering/text/layoutText.ts';
import {validateProject} from './snapshot/src/domain/validate.ts';
const base64=blob=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)});
window.audit=async()=>{
 const manifest=await fetch('./snapshot/templates/manifest.json').then(r=>r.json()),projects=[],blobs=new Map();
 for(const entry of manifest.templates){
  const project=await fetch('./snapshot/templates/projects/'+entry.project.split('/').pop()).then(r=>r.json());
  const valid=validateProject(project);if(!valid.ok)throw Error(JSON.stringify(valid));projects.push(project);
  for(const asset of project.assetManifest)if(!blobs.has(asset.id)){const r=await fetch('./snapshot/templates/assets/'+asset.id+'.png');if(!r.ok)throw Error(asset.id);blobs.set(asset.id,await r.blob())}
 }
 const combined={...projects[0],title:'템플릿 12종 출력 점검',slides:projects.flatMap(p=>p.slides),assetManifest:[...new Map(projects.flatMap(p=>p.assetManifest).map(a=>[a.id,a])).values()]};
 if(!validateProject(combined).ok)throw Error('Combined document invalid');
 const resolve=async id=>blobs.get(id),files={},expected=[];
 for(let i=0;i<combined.slides.length;i++){
  const slide=combined.slides[i],r=await renderSlide(slide,resolve,1);if(!r.ok)throw Error(JSON.stringify(r));
  files[`screen-${String(i+1).padStart(2,'0')}.png`]=r.canvas.toDataURL().split(',')[1];
  expected.push({index:i+1,template:manifest.templates[i].id,title:projects[i].title,images:slide.elements.filter(e=>e.type==='image').length,texts:slide.elements.filter(e=>e.type==='text').map(e=>({text:e.text,x:e.x,y:e.y,width:e.width,fontSize:e.fontSize,layout:layoutText(e)}))});
 }
 const measurements=[];
 for(const [kind,name] of [['editable','templates-editable.pptx'],['image','templates-image.pptx'],['pdf','templates.pdf']]){
  const start=performance.now(),r=kind==='pdf'?await exportPdf(combined,resolve):await exportPptx(combined,resolve,kind);if(!r.ok)throw Error(JSON.stringify(r));files[name]=await base64(r.blob);measurements.push({file:name,bytes:r.blob.size,ms:performance.now()-start,warnings:r.warnings});
 }
 const negative=[];
 for(const kind of ['editable','image','pdf']){
  const abort=new AbortController();abort.abort();const r=kind==='pdf'?await exportPdf(combined,resolve,{},abort.signal):await exportPptx(combined,resolve,kind,{},abort.signal);if(r.ok||r.code!=='CANCELLED')throw Error('Cancel failure');negative.push({kind,test:'cancelled',code:r.code});
  const missing=kind==='pdf'?await exportPdf({...combined,slides:[combined.slides[0]]},async()=>undefined):await exportPptx({...combined,slides:[combined.slides[0]]},async()=>undefined,kind);if(missing.ok||missing.code!=='ASSET_MISSING')throw Error('Missing asset failure');negative.push({kind,test:'missing-asset',code:missing.code});
 }
 // Extra technical page exercises transparent images separated by stroke runs.
 const image=combined.slides[0].elements.find(e=>e.type==='image');
 const probe={...combined,title:'투명도와 순서 시험',slides:[{id:crypto.randomUUID(),background:{kind:'solid',color:'#C9E8DB'},elements:[
  {id:crypto.randomUUID(),type:'stroke',x:0,y:0,points:[180,300,650,300],strokeWidth:36,color:'#F49A88'},
  {...image,id:crypto.randomUUID(),x:220,y:230,width:300,height:300*image.height/image.width},
  {id:crypto.randomUUID(),type:'stroke',x:0,y:0,points:[180,390,650,390],strokeWidth:20,color:'#8B75D9'},
  {id:crypto.randomUUID(),type:'text',x:730,y:130,width:390,text:'한글과 English 123\n긴문장줄바꿈검사입니다.\n가족 👨‍👩‍👧‍👦 와 무지개 🌈',fontId:'sans-ko',fontSize:36,bold:false,color:'#294052',align:'left',lineHeight:1.3},
  {id:crypto.randomUUID(),type:'stroke',x:0,y:0,points:[760,480],strokeWidth:30,color:'#EFAA55'}
 ]}]};
 // Use a genuinely transparent character instead of the first template panel.
 const characterEntry=manifest.templates[0].assets.find(a=>a.sourceId==='character-child');const a=combined.assetManifest.find(a=>a.id===characterEntry.assetId);probe.slides[0].elements[1].assetId=a.id;probe.slides[0].elements[1].height=300*a.pixelHeight/a.pixelWidth;
 if(!validateProject(probe).ok)throw Error('Probe invalid');
 const screen=await renderSlide(probe.slides[0],resolve,1);if(!screen.ok)throw Error('Probe render');files['probe-screen.png']=screen.canvas.toDataURL().split(',')[1];
 for(const kind of ['editable','image']){const r=await exportPptx(probe,resolve,kind);if(!r.ok)throw Error(JSON.stringify(r));files['probe-'+kind+'.pptx']=await base64(r.blob)}
 const probePdf=await exportPdf(probe,resolve);if(!probePdf.ok)throw Error('Probe PDF');files['probe.pdf']=await base64(probePdf.blob);
 return {files,expected,measurements,negative};
};
</script></body></html>
